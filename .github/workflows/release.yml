name: Build, test & release (Windows)

# Every push to main builds + tests the installer on real Windows.
# If it passes, it is published as GitHub Release v<version from subset/__init__.py>.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Vendor (Python runtime, get-pip)
        run: python installer/fetch_vendor.py

      - name: Build installer (NSIS)
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) { choco install nsis -y --no-progress }
            $env:Path += ";C:\Program Files (x86)\NSIS"
          }
          $ver = (Select-String -Path subset/__init__.py -Pattern '"(.+)"').Matches[0].Groups[1].Value
          "VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Force dist | Out-Null
          Push-Location installer
          makensis -V2 "-DVERSION=$ver" launcher.nsi
          if ($LASTEXITCODE -ne 0) { throw "launcher build failed" }
          makensis -V2 "-DVERSION=$ver" installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }
          Pop-Location
          Get-ChildItem dist

      - name: Fresh install (silent, real download of all dependencies)
        shell: pwsh
        run: |
          $t = Measure-Command { $p = Start-Process -FilePath "dist\SubSet-Setup-$env:VER.exe" -ArgumentList '/S' -Wait -PassThru }
          Write-Host "Install time: $($t.TotalMinutes) min, exit $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "installer exit $($p.ExitCode)" }
          foreach ($f in "SubSet.exe","Uninstall.exe","runtime\python\python.exe","app\subset\__main__.py") {
            if (-not (Test-Path "$env:LOCALAPPDATA\Programs\SubSet\$f")) { throw "missing $f" }
          }

      - name: Install log
        if: always()
        shell: pwsh
        run: Get-Content "$env:LOCALAPPDATA\SubSet\install.log" -ErrorAction SilentlyContinue

      - name: Smoke test (installed runtime)
        shell: pwsh
        run: |
          & "$env:LOCALAPPDATA\Programs\SubSet\runtime\python\python.exe" tests\smoke.py
          if ($LASTEXITCODE -ne 0) { throw "smoke test failed" }

      - name: App server starts
        shell: pwsh
        run: |
          $py = "$env:LOCALAPPDATA\Programs\SubSet\runtime\python\python.exe"
          $proc = Start-Process -FilePath $py -ArgumentList '-m','subset','--headless' -WorkingDirectory "$env:LOCALAPPDATA\Programs\SubSet\app" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:47321/api/status; if ($r.StatusCode -eq 200) { $ok = $true; Write-Host $r.Content; break } } catch {}
          }
          Stop-Process -Id $proc.Id -Force
          if (-not $ok) { Get-Content "$env:LOCALAPPDATA\SubSet\subset.log" -ErrorAction SilentlyContinue; throw "server did not start" }

      - name: Update install over existing (should be quick)
        shell: pwsh
        run: |
          $t = Measure-Command { $p = Start-Process -FilePath "dist\SubSet-Setup-$env:VER.exe" -ArgumentList '/S' -Wait -PassThru }
          Write-Host "Update time: $($t.TotalMinutes) min, exit $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "update exit $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: SubSet-Setup-${{ env.VER }}
          path: dist/SubSet-Setup-*.exe

      - name: GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: SubSet ${{ env.VER }}
          target_commitish: ${{ github.sha }}
          files: dist/SubSet-Setup-*.exe
          body: |
            Skini **SubSet-Setup-${{ env.VER }}.exe** ispod (Assets) i pokreni ga - instalira se preko prethodne verzije.
            Izmene: vidi CHANGELOG.md.
